name: Daily Firestore Backup

on:
  schedule:
    - cron: '0 17 * * *' # 00:00 Asia/Bangkok (UTC+7) every day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Pinned to a major on purpose: the unpinned install silently picked up v14, which removed
      # the namespaced admin.firestore()/admin.credential APIs this script used to call.
      - run: npm install firebase-admin@14
      - run: node scripts/backup-firestore.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Commit backup file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- backups/
          git diff --staged --quiet || git commit -m "Automated Firestore backup $(date -u +%F)"
          git push
